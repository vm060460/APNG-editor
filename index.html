<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動態影像編輯器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {} }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 transition-colors duration-300">
  <div id="root"></div>

  <script>
    const { useState, useEffect, useRef, useCallback, createElement: e } = React;

    // 內置 SVG 向量圖標，完全擺脫外部套件相依性
    const SVG_ICONS = {
      image: 'M15 22H9C4 22 2 20 2 15V9C2 4 4 2 9 2H15C20 2 22 4 22 9V15C22 20 20 22 15 22Z M9 10C10.1046 10 11 9.10457 11 8C11 6.89543 10.1046 6 9 6C7.89543 6 7 6.89543 7 8C7 9.10457 7.89543 10 9 10Z M21.4 17.2L17.6 13.4C16.8 12.6 15.6 12.6 14.8 13.4L14.3 13.9C13.9 14.3 13.3 14.3 12.9 13.9L10.2 11.2C9.4 10.4 8.2 10.4 7.4 11.2L2.6 16',
      upload: 'M22 10V15C22 20 20 22 15 22H9C4 22 2 20 2 15V9C2 4 4 2 9 2H14 M18 2V8M15 5H21',
      play: 'M7 4V20L19 12L7 4Z',
      pause: 'M6 19H10V5H6V19ZM14 5V19H18V5H14Z',
      sun: 'M12 18C15.3137 18 18 15.3137 18 12C18 8.68629 15.3137 6 12 6C8.68629 6 6 8.68629 6 12C6 15.3137 8.68629 18 12 18Z M12 2V4M12 20V22M4 12H2M22 12H20',
      moon: 'M21.0004 13.9401C20.4804 16.2701 19.1004 18.3101 17.1404 19.6401C15.1804 20.9701 12.8104 21.4801 10.4904 21.0601C6.01037 20.2501 2.62037 16.4201 2.50037 11.8701C2.38037 7.32007 5.57037 3.37007 9.99037 2.22007C10.5504 2.08007 11.1304 2.40007 11.2904 2.95007C11.4504 3.50007 11.1604 4.09007 10.6304 4.31007C8.16037 5.31007 6.51037 7.72007 6.50037 10.4001C6.49037 13.0801 8.12037 15.5001 10.5804 16.5201C13.0404 17.5401 15.8904 16.9601 17.7404 15.0601C18.1404 14.6501 18.7704 14.5401 19.2804 14.7901C19.8004 15.0401 20.0904 15.5901 21.0004 13.9401Z'
    };

    function Icon({ name, className = "w-4 h-4" }) {
      return e('svg', {
        className: className,
        viewBox: '0 0 24 24',
        fill: 'none',
        stroke: 'currentColor',
        strokeWidth: '2',
        strokeLinecap: 'round',
        strokeLinejoin: 'round'
      }, e('path', { d: SVG_ICONS[name] || '' }));
    }

    let parseGIF, decompressFrames, UPNG, fflate;

    const DEFAULT_FILTERS = { 
      opacity: 1.0, hue: 0, saturation: 100, brightness: 100, contrast: 100, 
      invert: 0, rotate: 0, translateX: 0, translateY: 0, scale: 1.0 
    };

    function App() {
      const [theme, setTheme] = useState('light');
      const [isAppReady, setIsAppReady] = useState(false);
      const [frames, setFrames] = useState([]);
      const [originalFileName, setOriginalFileName] = useState('edited_animation');
      
      const [currentFrameIndex, setCurrentFrameIndex] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [isLooping, setIsLooping] = useState(false); 
      const [speed, setSpeed] = useState(1.0);
      
      const [globalOpacity, setGlobalOpacity] = useState(1.0);
      const [globalHue, setGlobalHue] = useState(0);
      const [globalFlipX, setGlobalFlipX] = useState(false);
      const [globalFlipY, setGlobalFlipY] = useState(false);

      const [isExportModalOpen, setIsExportModalOpen] = useState(false);
      const [exportConfig, setExportConfig] = useState({ format: 'apng' });
      const [isLoading, setIsLoading] = useState(false);
      const [error, setError] = useState(null);
      
      const canvasRef = useRef(null);
      const currentFrameIndexRef = useRef(0);

      useEffect(() => {
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [theme]);

      useEffect(() => {
        const initModules = async () => {
          try {
            const dynamicImport = new Function('url', 'return import(url)');
            const gifuctModule = await dynamicImport('https://esm.sh/gifuct-js@2.1.2?bundle');
            const upngModule = await dynamicImport('https://esm.sh/upng-js@2.1.0?bundle');
            const fflateModule = await dynamicImport('https://esm.sh/fflate@0.8.2?bundle');
            
            parseGIF = gifuctModule.parseGIF || gifuctModule.default?.parseGIF;
            decompressFrames = gifuctModule.decompressFrames || gifuctModule.default?.decompressFrames;
            UPNG = upngModule.default || upngModule;
            fflate = fflateModule;

            setIsAppReady(true);
          } catch (err) {
            setError("引擎核心加載失敗，請檢查網路連線。");
          }
        };
        initModules();
      }, []);

      useEffect(() => { currentFrameIndexRef.current = currentFrameIndex; }, [currentFrameIndex]);

      const buildFrameObj = (canvas, delay) => ({
        canvas, delay, 
        customFilters: Object.assign({}, DEFAULT_FILTERS), 
        keyframes: { opacity: false, scale: false, rotate: false, translate: false, color: false }, 
        easings: { opacity: 'linear', scale: 'linear', rotate: 'linear', translate: 'linear', color: 'linear' }
      });

      const cloneCanvas = (oldCanvas) => {
        const c = document.createElement('canvas'); c.width = oldCanvas.width; c.height = oldCanvas.height;
        c.getContext('2d').drawImage(oldCanvas, 0, 0); return c;
      };

      const gifToFrames = (buffer) => {
        const gif = parseGIF(buffer); const rawFrames = decompressFrames(gif, true);
        const w = gif.lsd.width; const h = gif.lsd.height;
        const compositedFrames = [];
        const tempCanvas = document.createElement('canvas'); tempCanvas.width = w; tempCanvas.height = h;
        const tempCtx = tempCanvas.getContext('2d');
        let previousImageData = null;

        for (let i = 0; i < rawFrames.length; i++) {
          const { patch, dims, disposalType, delay } = rawFrames[i];
          if (disposalType !== 3) previousImageData = tempCtx.getImageData(0, 0, w, h);

          if (dims.width > 0 && dims.height > 0) {
            const patchData = new ImageData(new Uint8ClampedArray(patch), dims.width, dims.height);
            const patchCanvas = document.createElement('canvas');
            patchCanvas.width = dims.width; patchCanvas.height = dims.height;
            patchCanvas.getContext('2d').putImageData(patchData, 0, 0);
            tempCtx.drawImage(patchCanvas, dims.left, dims.top);
          }

          const finalDelay = (delay || 100) < 20 ? 100 : (delay || 100);
          compositedFrames.push(buildFrameObj(cloneCanvas(tempCanvas), finalDelay));
          if (disposalType === 2) tempCtx.clearRect(dims.left, dims.top, dims.width, dims.height);
          else if (disposalType === 3 && previousImageData) tempCtx.putImageData(previousImageData, 0, 0);
        }
        return compositedFrames;
      };

      const apngToFrames = async (buffer) => {
        const img = UPNG.decode(buffer); const rgbaFrames = UPNG.toRGBA8(img);
        return rgbaFrames.map((rgba, index) => {
          const imageData = new ImageData(new Uint8ClampedArray(rgba), img.width, img.height);
          const canvas = document.createElement('canvas'); canvas.width = img.width; canvas.height = img.height;
          canvas.getContext('2d').putImageData(imageData, 0, 0);
          return buildFrameObj(canvas, (img.frames && img.frames[index]) ? (img.frames[index].delay || 100) : 100);
        });
      };

      const loadGenericImage = async (file) => {
        const img = new Image(); const url = URL.createObjectURL(file);
        await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = url; });
        const canvas = document.createElement('canvas'); canvas.width = img.width; canvas.height = img.height;
        canvas.getContext('2d').drawImage(img, 0, 0); URL.revokeObjectURL(url);
        return [buildFrameObj(canvas, 1000)];
      };

      const handleFileDropOrSelect = async (file) => {
        if (!file || !isAppReady) return;
        try {
          setIsLoading(true); setError(null); setIsPlaying(false);
          const nameExtIdx = file.name.lastIndexOf('.');
          const nameWithoutExt = nameExtIdx !== -1 ? file.name.substring(0, nameExtIdx) : file.name;
          setOriginalFileName(nameWithoutExt);

          let parsedFrames = [];
          const buffer = await file.arrayBuffer(); const bytes = new Uint8Array(buffer);
          
          if (bytes[0] === 0x47 && bytes[1] === 0x49 && bytes[2] === 0x46) {
            parsedFrames = gifToFrames(buffer);
          } else if (bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4E && bytes[3] === 0x47) {
            parsedFrames = await apngToFrames(buffer);
          } else {
            parsedFrames = await loadGenericImage(file);
          }

          setFrames(parsedFrames); setCurrentFrameIndex(0);
        } catch (err) {
          setError("解析檔案失敗，請確保該檔案格式正確。");
        } finally { 
          setIsLoading(false); 
        }
      };

      useEffect(() => {
        if (frames.length > 0 && canvasRef.current) {
          const ctx = canvasRef.current.getContext('2d');
          const frame = frames[currentFrameIndex];
          if (!frame) return;
          const w = frame.canvas.width; const h = frame.canvas.height;
          
          if (canvasRef.current.width !== w) canvasRef.current.width = w;
          if (canvasRef.current.height !== h) canvasRef.current.height = h;
          
          ctx.clearRect(0, 0, w, h); 
          ctx.save();
          ctx.globalAlpha = globalOpacity;
          ctx.filter = `hue-rotate(${globalHue}deg)`;
          ctx.translate(w/2, h/2);
          ctx.scale(globalFlipX ? -1 : 1, globalFlipY ? -1 : 1);
          ctx.translate(-w/2, -h/2);
          ctx.drawImage(frame.canvas, 0, 0); 
          ctx.restore();
        }
      }, [frames, currentFrameIndex, globalOpacity, globalHue, globalFlipX, globalFlipY]);

      useEffect(() => {
        if (!isPlaying || frames.length <= 1) return;
        let animationId; let lastTime = performance.now();

        const loop = (timestamp) => {
          let targetDelay = ((frames[currentFrameIndexRef.current]?.delay || 100)) / speed;
          if (timestamp - lastTime >= targetDelay) {
            let nextIndex = currentFrameIndexRef.current + 1;
            if (nextIndex >= frames.length) {
              if (isLooping) nextIndex = 0;
              else { setIsPlaying(false); return; }
            }
            currentFrameIndexRef.current = nextIndex;
            setCurrentFrameIndex(nextIndex);
            lastTime = timestamp;
          }
          animationId = requestAnimationFrame(loop);
        };
        animationId = requestAnimationFrame(loop);
        return () => cancelAnimationFrame(animationId);
      }, [isPlaying, frames, speed, isLooping]);

      const handleConfirmExport = async () => {
        setIsLoading(true);
        try {
            let imgs = [], delays = [], exportW = frames[0].canvas.width, exportH = frames[0].canvas.height;
            for (let i = 0; i < frames.length; i++) {
                const canvas = document.createElement('canvas'); canvas.width = exportW; canvas.height = exportH;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(frames[i].canvas, 0, 0);
                imgs.push(ctx.getImageData(0,0,exportW,exportH).data.buffer);
                delays.push(frames[i].delay);
            }
            let apngBuffer = UPNG.encode(imgs, exportW, exportH, 0, delays);
            const blob = new Blob([apngBuffer], { type: 'image/apng' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `${originalFileName}_output.png`; a.click();
            setIsExportModalOpen(false);
        } catch (e) {
            setError("導出錯誤。");
        } finally { setIsLoading(false); }
      };

      // 構建純 JavaScript UI 樹，徹底規避 JSX 與 Babel 轉譯風險
      return e('div', { className: 'flex flex-col h-screen bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 font-sans overflow-hidden relative' },
        e('header', { className: 'px-6 py-3 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 flex items-center justify-between shadow-sm z-10 shrink-0' },
          e('h1', { className: 'text-xl font-bold flex items-center gap-2' }, e(Icon, { name: 'image', className: 'w-6 h-6 text-blue-600' }), '動態影像編輯器'),
          e('button', { onClick: () => setTheme(theme === 'light' ? 'dark' : 'light'), className: 'p-2 bg-slate-100 dark:bg-slate-800 rounded-lg' }, e(Icon, { name: theme === 'light' ? 'moon' : 'sun' }))
        ),
        e('main', { className: 'flex-1 flex overflow-hidden flex-col md:flex-row relative' },
          e('div', { className: 'flex-1 flex flex-col justify-center items-center p-8 checkered-bg-light relative min-h-0' },
            error && e('div', { className: 'absolute top-4 bg-red-100 text-red-700 px-4 py-2 rounded shadow' }, error),
            frames.length > 0 ? e('canvas', { ref: canvasRef, className: 'max-w-full max-h-full object-contain shadow-lg' }) : e('div', {
              className: 'border-2 border-dashed border-slate-300 p-12 text-center rounded-2xl cursor-pointer bg-white dark:bg-slate-800',
              onClick: () => document.getElementById('file-upload').click()
            }, e(Icon, { name: 'upload', className: 'w-12 h-12 text-blue-500 mx-auto mb-4' }), e('p', { className: 'text-lg font-bold' }, '匯入圖片 / 序列 / 動畫')),
            isLoading && e('div', { className: 'absolute inset-0 bg-white/60 flex items-center justify-center font-bold' }, '處理中...')
          ),
          frames.length > 0 && e('div', { className: 'w-full md:w-[360px] bg-white dark:bg-slate-800 border-l border-slate-200 dark:border-slate-700 p-6 flex flex-col gap-6 overflow-y-auto' },
            e('div', { className: 'flex gap-4 items-center' },
              e('button', { onClick: () => setIsPlaying(!isPlaying), className: 'p-3 bg-blue-600 text-white rounded-full hover:bg-blue-700' }, e(Icon, { name: isPlaying ? 'pause' : 'play' })),
              e('span', { className: 'text-sm font-bold' }, isPlaying ? '暫停播放' : '開始播放'),
              e('label', { className: 'flex items-center gap-2 ml-auto cursor-pointer text-xs' }, e('input', { type: 'checkbox', checked: isLooping, onChange: () => setIsLooping(!isLooping) }), '循環播放')
            ),
            e('hr', { className: 'dark:border-slate-700' }),
            e('div', { className: 'space-y-4' },
              e('div', null, e('span', { className: 'text-xs font-bold block mb-1' }, '色彩調整 (色相偏轉)'), e('input', { type: 'range', min: '0', max: '360', value: globalHue, onChange: e => setGlobalHue(Number(e.target.value)), className: 'w-full accent-blue-500' })),
              e('div', null, e('span', { className: 'text-xs font-bold block mb-1' }, '整體透明度'), e('input', { type: 'range', min: '0', max: '100', value: globalOpacity * 100, onChange: e => setGlobalOpacity(Number(e.target.value) / 100), className: 'w-full accent-blue-500' })),
              e('div', { className: 'flex gap-2 pt-2' },
                e('button', { onClick: () => setGlobalFlipX(!globalFlipX), className: 'flex-1 py-1.5 text-xs border rounded ' + (globalFlipX ? 'bg-blue-100 border-blue-400' : 'bg-transparent') }, '水平翻轉'),
                e('button', { onClick: () => setGlobalFlipY(!globalFlipY), className: 'flex-1 py-1.5 text-xs border rounded ' + (globalFlipY ? 'bg-blue-100 border-blue-400' : 'bg-transparent') }, '垂直翻轉')
              )
            ),
            e('button', { onClick: () => setIsExportModalOpen(true), className: 'w-full py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg mt-auto' }, '匯出 / 下載設定')
          )
        ),
        isExportModalOpen && e('div', { className: 'fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-[999]' },
          e('div', { className: 'bg-white dark:bg-slate-800 p-6 rounded-2xl max-w-sm w-full space-y-4' },
            e('h3', { className: 'font-bold text-lg' }, '確認導出設定'),
            e('p', { className: 'text-xs text-slate-500' }, '將輸出為高畫質、支援透明通道的 APNG 格式。'),
            e('div', { className: 'flex gap-2' },
              e('button', { onClick: () => setIsExportModalOpen(false), className: 'flex-1 py-2 bg-slate-200 dark:bg-slate-700 rounded text-sm' }, '取消'),
              e('button', { onClick: handleConfirmExport, className: 'flex-1 py-2 bg-blue-600 text-white rounded text-sm' }, '確認匯出')
            )
          )
        ),
        e('input', { id: 'file-upload', type: 'file', accept: 'image/gif,image/png,image/apng', className: 'hidden', onChange: e => handleFileDropOrSelect(e.target.files[0]) }),
        e('style', null, `
          .checkered-bg-light {
            background-image: linear-gradient(45deg, #e2e8f0 25%, transparent 25%), linear-gradient(-45deg, #e2e8f0 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #e2e8f0 75%), linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
            background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
          }
        `)
      );
    }

    const root = Trinity = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(App));
  </script>
</body>
</html>
